# Tissue sample configuration.
# Copy this file to tissue.yml and configure repositories before enabling the daemon.
# Tissue connects to an already-running resident OpenCode service through the
# TISSUE_OPENCODE_URL environment variable; it never starts or manages OpenCode.
#
# Environment storage boundaries:
# - TISSUE_STATE_DIR: private Tissue database/WAL and controller state.
# - TISSUE_WORKTREE_ROOT: absolute worktree root shared with OpenCode; when unset,
#   worktrees are placed below ${TISSUE_STATE_DIR}/worktrees.
# - TISSUE_SESSION_REGISTRY_DIR: absolute persisted registry path, default
#   /tissue-session-registry. The registry is Tissue RW/OpenCode RO and contains
#   one empty ses_* marker per managed session. There is no YAML key for it.
# - TISSUE_CONFIG: this file path, default ./tissue.yml.

pollIntervalSeconds: 300
maxConcurrentGlobal: 3
retentionDays: 90

# Optional fail-closed allowlist for current textual GitHub authors whose prose
# may cross an agent-visible retrieval/serialization boundary. This governs prose
# visibility only, not generic GitHub action/control authorization. Every entry
# must be a valid ASCII GitHub login; no whitespace padding or Unicode lookalikes.
# An invalid entry rejects the whole configuration; omitting this block denies
# prose at retrieval rather than enabling trust-all behavior. Objective lifecycle
# facts remain available independently. Unsupported reactions, inline review
# comments/threads, and review-body paths remain fail-closed.
# security:
#   trustedGithubUsers:
#     - maintainer
#     - release-bot

# Optional role settings. Names default to the dedicated Tissue agents. Model
# values are sent to the resident API and are not pinned in the agent files.
# agents:
#   triage:
#     agent: tissue-triage
#     model: provider/model
#   resolution:
#     agent: tissue-resolve
#     model: provider/model

# A repository may use a separate writable push fork. `pushRemote` is the local
# git remote that points to that fork. Remote URLs must not contain credentials.
# repos:
#   - owner: example
#     name: project
#     targetOwner: example
#     targetName: project
#     pushOwner: example-fork
#     pushName: project
#     pushRemote: fork
#     remote: https://github.com/example/project.git
#     localDir: /workspace/project
#     enabled: true
#     pollIntervalSeconds: 300
#     maxConcurrentPerRepo: 1
#     baseBranch: main
#     labels: [maintenance]
#     autoMerge: false
#     priority: 0
#     baselineBefore: '2026-09-01T00:00:00Z'

repos: []
