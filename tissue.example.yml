# Tissue — sample configuration template
#
# Production topology: one supervised Tissue daemon connected to the already-running
# resident OpenCode service via TISSUE_OPENCODE_URL. Tissue never starts or manages
# an OpenCode serve. All disposable worktrees default under TISSUE_STATE_DIR.
#
# Copy to tissue.yml and replace placeholders only after recording onboarding/model
# choices in artifacts/designs/process/tissue-t8-register.md.

pollIntervalSeconds: 300
maxConcurrentGlobal: 3
retentionDays: 90

# Optional role settings. The agent/model values are operator configuration and are
# transmitted to the resident OpenCode API; leave unset to use service defaults.
# agents:
#   triage:
#     agent: tissue-triage
#     model: provider/model
#   resolution:
#     agent: tissue-resolve
#     model: provider/model

# A repository may use a different writable push fork from its PR target. The
# target does NOT need push permission; the writable fork is named here, and
# `pushRemote` is the local git remote that points at it (for example `fork`).
# repos:
#   - owner: coaxk
#     name: subarr
#     targetOwner: coaxk
#     targetName: subarr
#     pushOwner: xiaden
#     pushName: subarr
#     pushRemote: fork
#     remote: https://github.com/coaxk/subarr.git
#     localDir: /workspace/subarr
#     # Worktrees always live under ${TISSUE_STATE_DIR}/worktrees/<owner>-<name>/<work-item-id>;
#     # there is no configurable or absolute worktree-root override.
#     enabled: true
#     pollIntervalSeconds: 300
#     maxConcurrentPerRepo: 1
#     baseBranch: main
#     labels: [maintenance]
#     autoMerge: false
#     priority: 0
#     baselineBefore: '2026-09-01T00:00:00Z'

repos: []
